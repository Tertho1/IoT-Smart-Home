<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" style="background:#0f172a">
<title>ESP32 Smart Home v1.1 Wiring Diagram</title>
<text x="600" y="30" text-anchor="middle" fill="#38bdf8" font-size="22" font-weight="700">ESP32 Smart Home v1.1 — Master Wiring Diagram</text>
<text x="600" y="50" text-anchor="middle" fill="#94a3b8" font-size="11">GPIO13 fix (was GPIO5) | All GND common | MQ-2 via divider | LDR via 3.3V divider | Relay active-LOW</text>
<rect x="520" y="120" width="160" height="620" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
<text x="600" y="150" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700">ESP32 DevKit V1</text>
<text x="600" y="165" text-anchor="middle" fill="#64748b" font-size="8">30-pin | VIN=5V | 3V3</text>
<g font-size="10" fill="#e2e8f0">
<rect x="360" y="195" width="90" height="22" rx="4" fill="#0ea5e9"/><text x="405" y="210" text-anchor="middle" fill="#fff" font-size="9">GPIO 4 - DHT11</text>
<rect x="360" y="230" width="90" height="22" rx="4" fill="#8b5cf6"/><text x="405" y="245" text-anchor="middle" fill="#fff" font-size="9">GPIO27 - PIR #1</text>
<rect x="360" y="265" width="90" height="22" rx="4" fill="#8b5cf6"/><text x="405" y="280" text-anchor="middle" fill="#fff" font-size="9">GPIO26 - PIR #2</text>
<rect x="360" y="300" width="90" height="22" rx="4" fill="#f59e0b"/><text x="405" y="315" text-anchor="middle" fill="#0f172a" font-weight="700" font-size="9">GPIO25 - Reed SW</text>
<rect x="360" y="335" width="90" height="22" rx="4" fill="#22c55e"/><text x="405" y="350" text-anchor="middle" fill="#052e16" font-weight="700" font-size="9">GPIO34 - LDR1</text>
<rect x="360" y="370" width="90" height="22" rx="4" fill="#22c55e"/><text x="405" y="385" text-anchor="middle" fill="#052e16" font-weight="700" font-size="9">GPIO35 - LDR2</text>
<rect x="360" y="405" width="90" height="22" rx="4" fill="#ef4444"/><text x="405" y="420" text-anchor="middle" fill="#fff" font-size="9">GPIO32 - MQ-2 AO*</text>
</g>
<g font-size="10" fill="#e2e8f0">
<rect x="730" y="195" width="90" height="22" rx="4" fill="#f97316"/><text x="775" y="210" text-anchor="middle" fill="#fff" font-size="9">GPIO13 - Relay IN1</text>
<rect x="730" y="230" width="90" height="22" rx="4" fill="#f97316"/><text x="775" y="245" text-anchor="middle" fill="#fff" font-size="9">GPIO18 - Relay IN2</text>
<rect x="730" y="265" width="90" height="22" rx="4" fill="#f97316"/><text x="775" y="280" text-anchor="middle" fill="#fff" font-size="9">GPIO19 - Relay IN3</text>
<rect x="730" y="300" width="90" height="22" rx="4" fill="#f97316"/><text x="775" y="315" text-anchor="middle" fill="#fff" font-size="9">GPIO21 - Relay IN4</text>
<rect x="730" y="335" width="90" height="22" rx="4" fill="#eab308"/><text x="775" y="350" text-anchor="middle" fill="#0f172a" font-weight="700" font-size="9">GPIO23 - Buzzer</text>
<rect x="730" y="425" width="90" height="18" rx="4" fill="#334155"/><text x="775" y="437" text-anchor="middle" fill="#94a3b8" font-size="8">3.3V - LDR/DHT</text>
<rect x="730" y="450" width="90" height="18" rx="4" fill="#dc2626"/><text x="775" y="462" text-anchor="middle" fill="#fff" font-size="8">5V - PIR/MQ2/Relay</text>
<rect x="730" y="475" width="90" height="18" rx="4" fill="#475569"/><text x="775" y="487" text-anchor="middle" fill="#fff" font-size="8">GND Common</text>
</g>

<g>
<rect x="40" y="180" width="300" height="70" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.2"/>
<text x="60" y="200" fill="#0ea5e9" font-size="11" font-weight="700">DHT11 — Living Room</text>
<text x="60" y="215" fill="#cbd5e1" font-size="9">VCC-3.3V  DATA-GPIO4  GND-GND</text>
<text x="60" y="230" fill="#94a3b8" font-size="8">Add 4.7k pull-up if bare sensor | Keep away from fan/MQ-2</text>
</g>
<g>
<rect x="40" y="265" width="300" height="70" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2"/>
<text x="60" y="285" fill="#8b5cf6" font-size="11" font-weight="700">HC-SR501 PIR #1 &amp; #2 — Living/Bedroom</text>
<text x="60" y="300" fill="#cbd5e1" font-size="9">VCC-5V  OUT-GPIO27/26  GND-GND</text>
<text x="60" y="315" fill="#fbbf24" font-size="8">! Measure OUT =3.3V before wiring! ESP32 not 5V-tolerant</text>
</g>
<g>
<rect x="40" y="350" width="300" height="90" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1.2"/>
<text x="60" y="370" fill="#22c55e" font-size="11" font-weight="700">LDR Divider (x2) — GPIO34 / GPIO35</text>
<text x="60" y="385" fill="#cbd5e1" font-size="9">3.3V - LDR - (GPIO34/35) - 10k - GND</text>
<text x="60" y="400" fill="#86efac" font-size="8">Bright - high ADC (2500-3500)  Dark - low ADC (200-800)</text>
<text x="60" y="415" fill="#94a3b8" font-size="8">ADC1 pins (Wi-Fi safe) | Input-only 34/35 ideal</text>
</g>
<g>
<rect x="40" y="455" width="300" height="85" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.2"/>
<text x="60" y="475" fill="#ef4444" font-size="11" font-weight="700">MQ-2 — Kitchen (AO via divider)</text>
<text x="60" y="490" fill="#cbd5e1" font-size="9">VCC-5V GND-GND AO-10k-(GPIO32)-20k-GND</text>
<text x="60" y="505" fill="#fecaca" font-size="8">! Never connect AO directly (5V - 3.33V scaled)</text>
<text x="60" y="520" fill="#94a3b8" font-size="8">Warm-up 2-3 min | Mount off foam (hot!)</text>
</g>
<g>
<rect x="40" y="555" width="300" height="55" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
<text x="60" y="575" fill="#f59e0b" font-size="11" font-weight="700">Reed Switch — Main Door</text>
<text x="60" y="590" fill="#cbd5e1" font-size="9">GPIO25 - Reed - GND   (INPUT_PULLUP)</text>
<text x="60" y="603" fill="#94a3b8" font-size="8">Magnet on door, switch on frame | OPEN=HIGH</text>
</g>
<g>
<rect x="860" y="180" width="300" height="145" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="1.2"/>
<text x="880" y="200" fill="#f97316" font-size="11" font-weight="700">4-Channel 5V Relay Module</text>
<text x="880" y="215" fill="#cbd5e1" font-size="9">VCC-5V  GND-GND  IN1-GPIO13* IN2-GPIO18</text>
<text x="880" y="230" fill="#cbd5e1" font-size="9">IN3-GPIO19  IN4-GPIO21  (*v1.1 fix from GPIO5)</text>
<rect x="880" y="238" width="260" height="22" rx="4" fill="#7c2d12" opacity="1"/>
<text x="1010" y="252" text-anchor="middle" fill="#fed7aa" font-size="8">Most boards ACTIVE-LOW: LOW=ON, HIGH=OFF</text>
<text x="880" y="272" fill="#fed7aa" font-size="8">Init: digitalWrite(HIGH) first in setup()!</text>
<text x="880" y="285" fill="#94a3b8" font-size="8">Ensure 3.3V-compatible inputs or use driver</text>
<text x="880" y="300" fill="#cbd5e1" font-size="9">COM-5V   NO-Load+ - GND (NO=off when idle)</text>
</g>
<g>
<rect x="860" y="335" width="140" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
<text x="930" y="355" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="700">Loads (5V DC)</text>
<text x="880" y="370" fill="#cbd5e1" font-size="9">CH1 NO - Living Light</text>
<text x="880" y="383" fill="#cbd5e1" font-size="9">CH2 NO - Bedroom Light</text>
<text x="880" y="396" fill="#cbd5e1" font-size="9">CH3 NO - Room Fan</text>
</g>
<g>
<rect x="1020" y="335" width="140" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
<text x="1090" y="355" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="700">Kitchen</text>
<text x="1040" y="370" fill="#cbd5e1" font-size="9">CH4 NO - Exhaust Fan</text>
<text x="1040" y="385" fill="#cbd5e1" font-size="9">GPIO23 - Buzzer</text>
<text x="1040" y="398" fill="#94a3b8" font-size="8">Active buzzer preferred</text>
</g>
<g>
<rect x="860" y="415" width="300" height="85" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="1.2"/>
<text x="880" y="435" fill="#e2e8f0" font-size="11" font-weight="700">Power Rails — Breadboard</text>
<text x="880" y="452" fill="#22c55e" font-size="9">3.3V rail - DHT11 + LDR dividers (do NOT use 5V)</text>
<text x="880" y="467" fill="#ef4444" font-size="9">5V rail - PIR VCC, MQ-2 VCC, Relay VCC, Loads</text>
<text x="880" y="482" fill="#94a3b8" font-size="9">GND - Common for ESP32 + all modules</text>
<text x="880" y="495" fill="#fbbf24" font-size="8">Use regulated 5V 2A supply + 1000uF bulk cap</text>
</g>
<rect x="40" y="640" width="1120" height="90" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
<text x="60" y="660" fill="#38bdf8" font-size="11" font-weight="700">Breadboard Layout Tips</text>
<text x="60" y="677" fill="#cbd5e1" font-size="9">- ESP32 straddles center gap | One rail 5V / one rail GND | Separate 3.3V section for LDRs | MQ-2 divider close to GPIO32</text>
<text x="60" y="692" fill="#cbd5e1" font-size="9">- Keep relay/load wires away from sensor signal wires | Label every wire both ends</text>
<text x="60" y="707" fill="#94a3b8" font-size="9">House: electronics under/behind model | Sensors through hidden wall holes | MQ-2 near stove but no flame/gas leak test</text>
<rect x="40" y="760" width="1120" height="110" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
<text x="60" y="780" fill="#e2e8f0" font-size="10" font-weight="700">Physical House — Room Mapping</text>
<text x="60" y="798" fill="#cbd5e1" font-size="9">Living Room: PIR#1 (GPIO27) + LDR1 (GPIO34) + DHT11 (GPIO4) + Light (CH1/GPIO13) + Fan (CH3/GPIO19)</text>
<text x="60" y="813" fill="#cbd5e1" font-size="9">Bedroom:     PIR#2 (GPIO26) + LDR2 (GPIO35) + Light (CH2/GPIO18)</text>
<text x="60" y="828" fill="#cbd5e1" font-size="9">Kitchen:     MQ-2 (GPIO32) + Exhaust (CH4/GPIO21) + Buzzer (GPIO23)  |  Main Door: Reed (GPIO25)</text>
<text x="60" y="853" fill="#fbbf24" font-size="8">SAFETY: Only 5V DC loads in student prototype — never 220V AC | Disconnect power before rewiring | MQ-2 hot, keep off foam</text>
<text x="980" y="865" fill="#475569" font-size="7">Smart_Home_Client_Design_ESP32_v1.1</text>
<g stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" opacity="1">
