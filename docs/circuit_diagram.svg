<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="1150" viewBox="0 0 1600 1150" xmlns="http://www.w3.org/2000/svg" style="background:#0f172a">
<title>Smart Home ESP32 v1.2 — Full Circuit Diagram (Pin-Level)</title>
<text x="800" y="32" text-anchor="middle" fill="#38bdf8" font-size="24" font-weight="800">Smart Home ESP32 v1.2 — Full Circuit Diagram</text>
<text x="800" y="52" text-anchor="middle" fill="#94a3b8" font-size="11">Every module pin → ESP32 GPIO • Dividers protect ADC • Relay COM/NO • Common GND — v1.2 layout, v1.1 GPIO fix</text>

<!-- Vertical buses for clean routing -->
<g stroke="#334155" stroke-width="1" stroke-dasharray="6 4" opacity="0.4" fill="none">
  <line x1="520" y1="140" x2="520" y2="900"/> <!-- left bus -->
  <line x1="1020" y1="140" x2="1020" y2="650"/> <!-- right bus -->
</g>

<!-- ESP32 -->
<rect x="740" y="120" width="170" height="780" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2.4"/>
<text x="825" y="150" text-anchor="middle" fill="#38bdf8" font-size="15" font-weight="800">ESP32 DevKit V1</text>
<text x="825" y="168" text-anchor="middle" fill="#64748b" font-size="8">30-pin • Wi-Fi • VIN 5V • 3V3 • GND</text>

<!-- ESP32 left pins (facing sensors) -->
<g font-size="9" font-family="Consolas">
  <rect x="640" y="192" width="100" height="20" rx="4" fill="#0f172a" stroke="#0ea5e9"/><text x="690" y="205" text-anchor="middle" fill="#38bdf8" font-weight="700">GPIO 4 ← DHT DATA</text>
  <rect x="640" y="232" width="100" height="20" rx="4" fill="#0f172a" stroke="#8b5cf6"/><text x="690" y="245" text-anchor="middle" fill="#c4b5fd" font-weight="700">GPIO27 ← PIR1 OUT</text>
  <rect x="640" y="272" width="100" height="20" rx="4" fill="#0f172a" stroke="#8b5cf6"/><text x="690" y="285" text-anchor="middle" fill="#c4b5fd" font-weight="700">GPIO26 ← PIR2 OUT</text>
  <rect x="640" y="312" width="100" height="20" rx="4" fill="#0f172a" stroke="#f59e0b"/><text x="690" y="325" text-anchor="middle" fill="#fde68a" font-weight="700">GPIO25 ← REED</text>
  <rect x="640" y="352" width="100" height="20" rx="4" fill="#0f172a" stroke="#22c55e"/><text x="690" y="365" text-anchor="middle" fill="#86efac" font-weight="700">GPIO34 ← LDR1</text>
  <rect x="640" y="392" width="100" height="20" rx="4" fill="#0f172a" stroke="#22c55e"/><text x="690" y="405" text-anchor="middle" fill="#86efac" font-weight="700">GPIO35 ← LDR2</text>
  <rect x="640" y="432" width="100" height="20" rx="4" fill="#0f172a" stroke="#ef4444"/><text x="690" y="445" text-anchor="middle" fill="#fecaca" font-weight="700">GPIO32 ← MQ-2 AO</text>
</g>
<!-- ESP32 power pins (bottom) -->
<g font-size="8" font-family="Consolas">
  <rect x="640" y="480" width="100" height="16" rx="4" fill="#1e293b" stroke="#22c55e"/><text x="690" y="490" text-anchor="middle" fill="#86efac">3V3 → LDR/DHT</text>
  <rect x="640" y="505" width="100" height="16" rx="4" fill="#1e293b" stroke="#ef4444"/><text x="690" y="515" text-anchor="middle" fill="#fecaca">5V → PIR/MQ2/Relay</text>
  <rect x="640" y="530" width="100" height="16" rx="4" fill="#1e293b" stroke="#64748b"/><text x="690" y="540" text-anchor="middle" fill="#cbd5e1">GND COMMON</text>
</g>
<!-- ESP32 right pins -->
<g font-size="9" font-family="Consolas">
  <rect x="910" y="192" width="110" height="20" rx="4" fill="#0f172a" stroke="#f97316"/><text x="965" y="205" text-anchor="middle" fill="#fed7aa" font-weight="700">GPIO13 → RELAY IN1</text>
  <rect x="910" y="232" width="110" height="20" rx="4" fill="#0f172a" stroke="#f97316"/><text x="965" y="245" text-anchor="middle" fill="#fed7aa" font-weight="700">GPIO18 → RELAY IN2</text>
  <rect x="910" y="272" width="110" height="20" rx="4" fill="#0f172a" stroke="#f97316"/><text x="965" y="265" text-anchor="middle" fill="#fed7aa" font-weight="700">GPIO19 → RELAY IN3</text>
  <rect x="910" y="312" width="110" height="20" rx="4" fill="#0f172a" stroke="#f97316"/><text x="965" y="325" text-anchor="middle" fill="#fed7aa" font-weight="700">GPIO21 → RELAY IN4</text>
  <rect x="910" y="352" width="110" height="20" rx="4" fill="#0f172a" stroke="#eab308"/><text x="965" y="365" text-anchor="middle" fill="#fef08a" font-weight="700">GPIO23 → BUZZER</text>
</g>
<!-- Dots on ESP32 pins -->
<g fill="#0f172a" stroke-width="1.4">
  <circle cx="640" cy="202" r="4.5" fill="#38bdf8" stroke="#38bdf8"/><circle cx="910" cy="202" r="4.5" fill="#f97316" stroke="#f97316"/>
  <circle cx="640" cy="242" r="4.5" fill="#8b5cf6" stroke="#8b5cf6"/><circle cx="910" cy="242" r="4.5" fill="#f97316" stroke="#f97316"/>
  <circle cx="640" cy="282" r="4.5" fill="#8b5cf6" stroke="#8b5cf6"/><circle cx="910" cy="282" r="4.5" fill="#f97316" stroke="#f97316"/>
  <circle cx="640" cy="322" r="4.5" fill="#f59e0b" stroke="#f59e0b"/><circle cx="910" cy="322" r="4.5" fill="#f97316" stroke="#f97316"/>
  <circle cx="640" cy="362" r="4.5" fill="#22c55e" stroke="#22c55e"/><circle cx="910" cy="362" r="4.5" fill="#eab308" stroke="#eab308"/>
  <circle cx="640" cy="402" r="4.5" fill="#22c55e" stroke="#22c55e"/>
  <circle cx="640" cy="442" r="4.5" fill="#ef4444" stroke="#ef4444"/>
</g>

<!-- LEFT COLUMN: Sensors -->
<!-- DHT11 -->
<g>
  <rect x="60" y="172" width="300" height="90" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.4"/>
  <text x="210" y="195" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="800">DHT11 — Living Room</text>
  <text x="75" y="215" fill="#94a3b8" font-size="7" font-family="Consolas">Module (3 pins)</text>
  <text x="75" y="232" fill="#cbd5e1" font-size="9" font-family="Consolas">VCC</text><text x="130" y="232" fill="#22c55e" font-size="9" font-family="Consolas">→ 3.3V</text><circle cx="350" cy="229" r="4" fill="#22c55e" stroke="#0f172a" stroke-width="1.2"/>
  <text x="75" y="252" fill="#cbd5e1" font-size="9" font-family="Consolas">DATA</text><text x="130" y="252" fill="#38bdf8" font-size="9" font-family="Consolas">→ GPIO4</text><circle cx="350" cy="249" r="4" fill="#38bdf8" stroke="#0f172a" stroke-width="1.2"/>
  <text x="75" y="272" fill="#64748b" font-size="7" font-family="Consolas">+ 4.7k pull-up if bare sensor</text>
  <text x="75" y="285" fill="#cbd5e1" font-size="9" font-family="Consolas">GND</text><text x="130" y="285" fill="#64748b" font-size="9" font-family="Consolas">→ GND</text><circle cx="350" cy="282" r="4" fill="#64748b" stroke="#0f172a" stroke-width="1.2"/>
</g>
<!-- PIR1 -->
<g>
  <rect x="60" y="282" width="300" height="100" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.4"/>
  <text x="210" y="305" text-anchor="middle" fill="#8b5cf6" font-size="12" font-weight="800">PIR #1 — HC-SR501 (Living)</text>
  <text x="75" y="325" fill="#cbd5e1" font-size="9" font-family="Consolas">VCC</text><text x="130" y="325" fill="#ef4444" font-size="9" font-family="Consolas">→ 5V</text><circle cx="350" cy="322" r="4" fill="#ef4444" stroke="#0f172a" stroke-width="1.2"/>
  <text x="75" y="345" fill="#cbd5e1" font-size="9" font-family="Consolas">OUT</text><text x="130" y="345" fill="#8b5cf6" font-size="9" font-family="Consolas">→ GPIO27</text><circle cx="350" cy="342" r="4" fill="#8b5cf6" stroke="#0f172a" stroke-width="1.2"/>
  <text x="75" y="365" fill="#fbbf24" font-size="7.5" font-family="Consolas">⚠ Measure OUT=3.3V on motion first</text>
  <text x="75" y="380" fill="#cbd5e1" font-size="9" font-family="Consolas">GND</text><text x="130" y="380" fill="#64748b" font-size="9" font-family="Consolas">→ GND</text><circle cx="350" cy="377" r="4" fill="#64748b" stroke="#0f172a" stroke-width="1.2"/>
</g>
<!-- PIR2 -->
<g>
  <rect x="60" y="402" width="300" height="100" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.4"/>
  <text x="210" y="425" text-anchor="middle" fill="#8b5cf6" font-size="12" font-weight="800">PIR #2 — HC-SR501 (Bedroom)</text>
  <text x="75" y="445" fill="#cbd5e1" font-size="9" font-family="Consolas">VCC</text><text x="130" y="445" fill="#ef4444" font-size="9" font-family="Consolas">→ 5V</text><circle cx="350" cy="442" r="4" fill="#ef4444" stroke="#0f172a" stroke-width="1.2"/>
  <text x="75" y="465" fill="#cbd5e1" font-size="9" font-family="Consolas">OUT</text><text x="130" y="465" fill="#8b5cf6" font-size="9" font-family="Consolas">→ GPIO26</text><circle cx="350" cy="462" r="4" fill="#8b5cf6" stroke="#0f172a" stroke-width="1.2"/>
  <text x="75" y="485" fill="#cbd5e1" font-size="9" font-family="Consolas">GND</text><text x="130" y="485" fill="#64748b" font-size="9" font-family="Consolas">→ GND</text><circle cx="350" cy="482" r="4" fill="#64748b" stroke="#0f172a" stroke-width="1.2"/>
</g>
<!-- Reed -->
<g>
  <rect x="60" y="522" width="300" height="85" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="210" y="545" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="800">Reed Switch — Main Door</text>
  <text x="75" y="565" fill="#cbd5e1" font-size="9" font-family="Consolas">Pin 1</text><text x="130" y="565" fill="#f59e0b" font-size="9" font-family="Consolas">→ GPIO25</text><circle cx="350" cy="562" r="4" fill="#f59e0b" stroke="#0f172a" stroke-width="1.2"/>
  <text x="75" y="585" fill="#cbd5e1" font-size="9" font-family="Consolas">Pin 2</text><text x="130" y="585" fill="#64748b" font-size="9" font-family="Consolas">→ GND</text><circle cx="350" cy="582" r="4" fill="#64748b" stroke="#0f172a" stroke-width="1.2"/>
  <text x="75" y="600" fill="#94a3b8" font-size="7.5" font-family="Consolas">INPUT_PULLUP • OPEN=HIGH</text>
</g>
<!-- LDR1 -->
<g>
  <rect x="60" y="627" width="300" height="95" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1.4"/>
  <text x="210" y="650" text-anchor="middle" fill="#22c55e" font-size="12" font-weight="800">LDR #1 — Living</text>
  <text x="75" y="670" fill="#cbd5e1" font-size="9" font-family="Consolas">3.3V ─ LDR ─┐</text>
  <text x="75" y="688" fill="#86efac" font-size="9" font-family="Consolas">         ├─●→ GPIO34</text><circle cx="175" cy="685" r="4" fill="#22c55e" stroke="#0f172a" stroke-width="1.2"/><circle cx="350" cy="685" r="4" fill="#22c55e" stroke="#0f172a" stroke-width="1.2"/>
  <text x="75" y="706" fill="#cbd5e1" font-size="9" font-family="Consolas">         └─10k → GND</text>
  <text x="75" y="720" fill="#94a3b8" font-size="7" font-family="Consolas">Bright 2500-3500 / Dark 200-800</text>
</g>
<!-- LDR2 -->
<g>
  <rect x="60" y="742" width="300" height="95" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1.4"/>
  <text x="210" y="765" text-anchor="middle" fill="#22c55e" font-size="12" font-weight="800">LDR #2 — Bedroom</text>
  <text x="75" y="785" fill="#cbd5e1" font-size="9" font-family="Consolas">3.3V ─ LDR ─┐</text>
  <text x="75" y="803" fill="#86efac" font-size="9" font-family="Consolas">         ├─●→ GPIO35</text><circle cx="175" cy="800" r="4" fill="#22c55e" stroke="#0f172a" stroke-width="1.2"/><circle cx="350" cy="800" r="4" fill="#22c55e" stroke="#0f172a" stroke-width="1.2"/>
  <text x="75" y="821" fill="#cbd5e1" font-size="9" font-family="Consolas">         └─10k → GND</text>
</g>
<!-- MQ-2 -->
<g>
  <rect x="60" y="857" width="300" height="120" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="1.4"/>
  <text x="210" y="880" text-anchor="middle" fill="#ef4444" font-size="12" font-weight="800">MQ-2 — Kitchen (AO divider)</text>
  <text x="75" y="900" fill="#cbd5e1" font-size="9" font-family="Consolas">VCC → 5V</text><circle cx="350" cy="897" r="4" fill="#ef4444" stroke="#0f172a" stroke-width="1.2"/>
  <text x="75" y="918" fill="#cbd5e1" font-size="9" font-family="Consolas">GND → GND</text><circle cx="350" cy="915" r="4" fill="#64748b" stroke="#0f172a" stroke-width="1.2"/>
  <text x="75" y="936" fill="#fecaca" font-size="9" font-family="Consolas">AO →10k→●→ GPIO32</text><circle cx="165" cy="933" r="4" fill="#ef4444" stroke="#0f172a" stroke-width="1.2"/><circle cx="350" cy="933" r="4" fill="#ef4444" stroke="#0f172a" stroke-width="1.2"/>
  <text x="75" y="954" fill="#cbd5e1" font-size="8" font-family="Consolas">        └20k→GND (5V→3.33V)</text>
  <text x="75" y="970" fill="#fbbf24" font-size="7" font-family="Consolas">⚠ Never direct • Warm-up 2-3 min</text>
</g>

<!-- RIGHT COLUMN: Relay + Loads + Buzzer -->
<g>
  <rect x="1100" y="172" width="360" height="210" rx="10" fill="#1e293b" stroke="#f97316" stroke-width="1.6"/>
  <text x="1280" y="195" text-anchor="middle" fill="#f97316" font-size="13" font-weight="800">4-Channel Relay — 5V</text>
  <text x="1115" y="215" fill="#94a3b8" font-size="7.5" font-family="Consolas">Active-LOW: LOW=ON — init HIGH (OFF)</text>
  <text x="1115" y="235" fill="#cbd5e1" font-size="9" font-family="Consolas">VCC</text><text x="1165" y="235" fill="#ef4444" font-size="9" font-family="Consolas">→ 5V</text><circle cx="1095" cy="232" r="4" fill="#ef4444" stroke="#0f172a" stroke-width="1.2"/>
  <text x="1115" y="255" fill="#cbd5e1" font-size="9" font-family="Consolas">GND</text><text x="1165" y="255" fill="#64748b" font-size="9" font-family="Consolas">→ GND</text><circle cx="1095" cy="252" r="4" fill="#64748b" stroke="#0f172a" stroke-width="1.2"/>
  <text x="1115" y="275" fill="#cbd5e1" font-size="9" font-family="Consolas">IN1</text><text x="1165" y="275" fill="#fed7aa" font-size="9" font-family="Consolas">→ GPIO13 * Living</text><circle cx="1095" cy="272" r="4" fill="#f97316" stroke="#0f172a" stroke-width="1.2"/>
  <text x="1115" y="295" fill="#cbd5e1" font-size="9" font-family="Consolas">IN2</text><text x="1165" y="295" fill="#fed7aa" font-size="9" font-family="Consolas">→ GPIO18 Bedroom</text><circle cx="1095" cy="292" r="4" fill="#f97316" stroke="#0f172a" stroke-width="1.2"/>
  <text x="1115" y="315" fill="#cbd5e1" font-size="9" font-family="Consolas">IN3</text><text x="1165" y="315" fill="#fed7aa" font-size="9" font-family="Consolas">→ GPIO19 Fan</text><circle cx="1095" cy="312" r="4" fill="#f97316" stroke="#0f172a" stroke-width="1.2"/>
  <text x="1115" y="335" fill="#cbd5e1" font-size="9" font-family="Consolas">IN4</text><text x="1165" y="335" fill="#fed7aa" font-size="9" font-family="Consolas">→ GPIO21 Exhaust</text><circle cx="1095" cy="332" r="4" fill="#f97316" stroke="#0f172a" stroke-width="1.2"/>
  <rect x="1115" y="350" width="330" height="18" rx="4" fill="#7c2d12"/>
  <text x="1280" y="362" text-anchor="middle" fill="#fed7aa" font-size="7.5" font-weight="700">* GPIO13 v1.2 (was GPIO5 strapping) — no chatter</text>
</g>
<g>
  <rect x="1100" y="402" width="360" height="150" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="1280" y="425" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="800">5V Loads — Relay NO Contacts</text>
  <text x="1115" y="445" fill="#e2e8f0" font-size="9" font-family="Consolas">5V → COM1  NO1 → Living Light  → GND</text>
  <text x="1115" y="465" fill="#e2e8f0" font-size="9" font-family="Consolas">5V → COM2  NO2 → Bedroom Light → GND</text>
  <text x="1115" y="485" fill="#e2e8f0" font-size="9" font-family="Consolas">5V → COM3  NO3 → Room Fan      → GND</text>
  <text x="1115" y="505" fill="#e2e8f0" font-size="9" font-family="Consolas">5V → COM4  NO4 → Kitchen Exhaust→ GND</text>
  <text x="1115" y="525" fill="#94a3b8" font-size="7.5" font-family="Consolas">NO = Normally Open (OFF when idle)</text>
  <text x="1115" y="540" fill="#fecaca" font-size="7.5" font-family="Consolas">Never drive load from GPIO</text>
</g>
<g>
  <rect x="1100" y="572" width="360" height="100" rx="10" fill="#1e293b" stroke="#eab308" stroke-width="1.4"/>
  <text x="1280" y="595" text-anchor="middle" fill="#eab308" font-size="12" font-weight="800">Buzzer — Kitchen</text>
  <text x="1115" y="615" fill="#cbd5e1" font-size="9" font-family="Consolas">+ / IN</text><text x="1165" y="615" fill="#fef08a" font-size="9" font-family="Consolas">→ GPIO23</text><circle cx="1095" cy="612" r="4" fill="#eab308" stroke="#0f172a" stroke-width="1.2"/>
  <text x="1115" y="635" fill="#cbd5e1" font-size="9" font-family="Consolas">- / GND</text><text x="1165" y="635" fill="#64748b" font-size="9" font-family="Consolas">→ GND</text><circle cx="1095" cy="632" r="4" fill="#64748b" stroke="#0f172a" stroke-width="1.2"/>
  <text x="1115" y="655" fill="#94a3b8" font-size="7.5" font-family="Consolas">Active buzzer — transistor for 5V high-current</text>
</g>

<!-- Power at bottom -->
<g>
  <rect x="520" y="1000" width="560" height="110" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="800" y="1025" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="800">Power — Regulated 5V 2A + 3.3V</text>
  <text x="535" y="1045" fill="#22c55e" font-size="9" font-family="Consolas">3.3V ──► DHT11 VCC  +  LDR dividers (never 5V)</text>
  <text x="535" y="1065" fill="#ef4444" font-size="9" font-family="Consolas">5V ──► PIR VCC + MQ-2 VCC + Relay VCC + Loads + ESP32 VIN</text>
  <text x="535" y="1085" fill="#94a3b8" font-size="9" font-family="Consolas">GND ──► COMMON (ESP32 + all modules + loads) + 1000µF near VIN</text>
  <text x="535" y="1100" fill="#fbbf24" font-size="7.5" font-family="Consolas">Only 5V DC • Disconnect before rewiring • MQ-2 hot</text>
</g>

<!-- Clean wires: left sensors → bus → ESP32, right relay → bus → ESP32 -->
<g stroke-width="2.6" stroke-linecap="round" fill="none">
  <!-- DHT DATA -->
  <path d="M 350 249 L 520 249" stroke="#38bdf8"/>
  <path d="M 520 249 L 520 202 L 640 202" stroke="#38bdf8"/>
  <!-- PIR1 OUT -->
  <path d="M 350 342 L 520 342" stroke="#8b5cf6"/>
  <path d="M 520 342 L 520 242 L 640 242" stroke="#8b5cf6"/>
  <!-- PIR2 OUT -->
  <path d="M 350 462 L 520 462" stroke="#8b5cf6"/>
  <path d="M 520 462 L 520 282 L 640 282" stroke="#8b5cf6"/>
  <!-- Reed -->
  <path d="M 350 562 L 520 562" stroke="#f59e0b"/>
  <path d="M 520 562 L 520 322 L 640 322" stroke="#f59e0b"/>
  <!-- LDR1 -->
  <path d="M 350 685 L 520 685" stroke="#22c55e"/>
  <path d="M 520 685 L 520 362 L 640 362" stroke="#22c55e"/>
  <!-- LDR2 -->
  <path d="M 350 800 L 520 800" stroke="#22c55e"/>
  <path d="M 520 800 L 520 402 L 640 402" stroke="#22c55e"/>
  <!-- MQ2 -->
  <path d="M 350 933 L 520 933" stroke="#ef4444"/>
  <path d="M 520 933 L 520 442 L 640 442" stroke="#ef4444"/>

  <!-- Relay INs: ESP32 right → bus → relay left -->
  <path d="M 910 202 L 1020 202" stroke="#f97316"/>
  <path d="M 1020 202 L 1020 272 L 1095 272" stroke="#f97316"/>
  <path d="M 910 242 L 1020 242" stroke="#f97316"/>
  <path d="M 1020 242 L 1020 292 L 1095 292" stroke="#f97316"/>
  <path d="M 910 282 L 1020 282" stroke="#f97316"/>
  <path d="M 1020 282 L 1020 312 L 1095 312" stroke="#f97316"/>
  <path d="M 910 322 L 1020 322" stroke="#f97316"/>
  <path d="M 1020 322 L 1020 332 L 1095 332" stroke="#f97316"/>
  <!-- Buzzer -->
