  <path d="M 1020 362 L 1020 612 L 1095 612" stroke="#eab308"/>
</g>

<!-- Power buses (subtle) -->
<g stroke-width="1.8" fill="none" opacity="0.35">
  <path d="M 350 229 L 350 210 L 520 210 L 520 485 L 640 485" stroke="#22c55e" stroke-dasharray="8 6"/>
  <path d="M 350 322 L 350 310 L 800 310 L 800 1010 L 520 1010" stroke="#ef4444" stroke-dasharray="8 6"/>
  <path d="M 1095 232 L 1150 232 L 1150 1010 L 520 1010" stroke="#ef4444" stroke-dasharray="8 6"/>
</g>

